<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Complaint Management</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --maroon:#6E1423; --navy:#1F2A44; --gold:#9C7A3C; --blue:#2563BE; --brick:#A13D3D; --green:#2F6F4E;
  --bg:#FFFFFF; --card:#FFFFFF; --line:#D8D3CC; --text:#22262B; --muted:#6B6F76;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; margin:0;}
button{cursor:pointer;font-family:inherit;}
.letterhead{border-bottom:3px double var(--navy);padding:16px 20px;background:linear-gradient(180deg,#FBF9F6,#fff);}
.letterhead .inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.letterhead h1{font-size:19px;letter-spacing:.5px;}
.letterhead .sub{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.session{display:flex;align-items:center;gap:14px;font-size:13px;}
.session .who{text-align:right;line-height:1.3;}
.session .who b{display:block;font-family:Georgia,serif;}
.session .who span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:9px 18px;border-radius:4px;
  font-size:13px;letter-spacing:.4px;text-transform:uppercase;transition:transform .12s,box-shadow .12s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.12);}
.btn.outline{background:#fff;color:var(--navy);}
.btn.small{padding:5px 10px;font-size:11px;}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:6px;padding:20px;margin-bottom:16px;
  box-shadow:0 1px 4px rgba(31,42,68,.06);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:0 1px 4px rgba(31,42,68,.06);
  border-left:4px solid var(--navy);}
.stat .n{font-size:28px;font-weight:700;}
.stat .l{color:var(--muted);font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;font-family:inherit;}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:2px;
  background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;}
textarea{min-height:80px;resize:vertical;}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;}
.badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:600;color:#fff;letter-spacing:.3px;}
.badge.Open{background:var(--brick);}
.badge.In-Progress{background:var(--gold);}
.badge.Resolved{background:var(--green);}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{padding:9px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);}
.hist{font-size:11px;color:var(--muted);margin-top:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.hist div{padding:2px 0;}
.hidden{display:none !important;}
.small-note{font-size:12px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 16px;border-radius:2px;font-size:13px;max-width:90%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;}

/* ---- Login ---- */
.login-outer{max-width:480px;margin:44px auto;}
.login-outer h1{font-size:22px;text-align:center;}
.login-outer .sub{text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:4px 0 20px;}
.role-tabs{display:flex;border:1px solid var(--line);border-radius:6px 6px 0 0;overflow:hidden;margin-bottom:0;}
.role-tabs button{flex:1;padding:10px 6px;background:#F7F5F2;border:none;border-right:1px solid var(--line);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);}
.role-tabs button:last-child{border-right:none;}
.role-tabs button.active{background:#fff;color:var(--text);}
.login-card{border:1px solid var(--line);border-top:none;padding:24px;border-radius:0 0 6px 6px;box-shadow:0 4px 16px rgba(31,42,68,.08);}
.login-card .role-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#fff;padding:4px 10px;
  display:inline-block;border-radius:2px;margin-bottom:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
</style>
</head>
<body>

<div id="login-screen" class="login-outer wrap">
  <h1>Campus Complaint Management</h1>
  <div class="sub">Grievance Registration &amp; Tracking Portal</div>
  <div class="role-tabs" id="roleTabs"></div>
  <div class="login-card" id="loginCard"></div>
</div>

<div id="app" class="hidden">
  <div class="letterhead">
    <div class="inner">
      <div>
        <h1>Campus Complaint Management</h1>
        <div class="sub">Grievance Registration &amp; Tracking Portal</div>
      </div>
      <div class="session">
        <div class="who"><b id="userName"></b><span id="userRole"></span></div>
        <button class="btn outline small" onclick="logout()">Log Out</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
